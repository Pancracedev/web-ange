<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gourmet+ Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#f97316;
      --dark:#0f172a;
      --card:#1e293b;
      --text:#ffffff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:var(--dark);
      color:var(--text);
      overflow-x:hidden;
    }

    /* NAVBAR */
    header{
      position:fixed;
      top:0;
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 60px;
      background:rgba(15,23,42,0.7);
      backdrop-filter:blur(12px);
      z-index:1000;
      transition:0.3s;
    }

    header.shrink{
      padding:10px 60px;
      background:rgba(15,23,42,0.95);
    }

    header h1{
      color:var(--primary);
      font-size:1.4rem;
    }

    nav a{
      margin:0 12px;
      text-decoration:none;
      color:white;
      font-weight:500;
    }

    nav a:hover{color:var(--primary);}

    .cart-btn{
      background:var(--primary);
      border:none;
      padding:10px 15px;
      border-radius:20px;
      cursor:pointer;
      color:white;
    }

    /* HERO */
    .hero{
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.7)),
      url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092');
      background-size:cover;
      background-position:center;
    }

    .hero h2{font-size:3rem;}
    .hero p{opacity:0.8;margin-top:10px;}

    .btn{
      margin-top:20px;
      padding:12px 25px;
      background:var(--primary);
      border:none;
      border-radius:30px;
      cursor:pointer;
      color:white;
    }

    section{
      padding:90px 60px;
      text-align:center;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:40px;
    }

    .card{
      background:var(--card);
      border-radius:20px;
      padding:15px;
      transition:0.4s;
      cursor:pointer;
      opacity:0;
      transform:translateY(40px);
    }

    .card.show{
      opacity:1;
      transform:translateY(0);
    }

    .card:hover{transform:translateY(-8px);}

    .card img{
      width:100%;
      border-radius:15px;
    }

    /* CART */
    .modal{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      display:none;
      justify-content:center;
      align-items:center;
    }

    .modal-content{
      background:white;
      color:black;
      padding:30px;
      border-radius:15px;
      width:300px;
    }

    .close{float:right;cursor:pointer;}

  </style>
</head>
<body>

<header id="header">
  <h1>🍽 Gourmet+</h1>
  <nav>
    <a href="#menu">Menu</a>
    <a href="#about">À propos</a>
    <a href="#contact">Contact</a>
  </nav>
  <button class="cart-btn" onclick="openCart()">🛒</button>
</header>

<section class="hero">
  <div>
    <h2>Expérience culinaire premium</h2>
    <p>Commandez en ligne en quelques secondes</p>
    <button class="btn">Découvrir</button>
  </div>
</section>

<section id="menu">
  <h2>Menu</h2>
  <div class="cards">

    <div class="card" onclick="add('Pizza')">
      <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe">
      <h3>Pizza</h3>
      <p>8000 FCFA</p>
    </div>

    <div class="card" onclick="add('Burger')">
      <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38">
      <h3>Burger</h3>
      <p>6500 FCFA</p>
    </div>

  </div>
</section>

<section id="about">
  <h2>À propos</h2>
  <p>Restaurant moderne avec livraison rapide et qualité premium.</p>
</section>

<section id="contact">
  <h2>Contact</h2>
  <p>contact@gourmetplus.com</p>
</section>

<footer style="text-align:center;padding:30px;">
© 2026 Gourmet+
</footer>

<div class="modal" id="cart">
  <div class="modal-content">
    <span class="close" onclick="closeCart()">×</span>
    <h3>Panier</h3>
    <ul id="list"></ul>
  </div>
</div>

<script>
let cart=[];

function add(item){
  cart.push(item);
  alert(item+" ajouté");
}

function openCart(){
  document.getElementById('cart').style.display='flex';
  render();
}

function closeCart(){
  document.getElementById('cart').style.display='none';
}

function render(){
  let list=document.getElementById('list');
  list.innerHTML="";
  cart.forEach(i=>{
    let li=document.createElement('li');
    li.textContent=i;
    list.appendChild(li);
  });
}

const cards=document.querySelectorAll('.card');
window.addEventListener('scroll',()=>{
  cards.forEach(c=>{
    if(c.getBoundingClientRect().top<window.innerHeight-100){
      c.classList.add('show');
    }
  });
});

window.addEventListener('scroll',()=>{
  document.getElementById('header').classList.toggle('shrink',window.scrollY>50);
});
</script>

</body>
</html>
